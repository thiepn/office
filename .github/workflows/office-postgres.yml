name: Office isolated PostgreSQL
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: office-test-only
          POSTGRES_DB: office_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d office_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Test private schema against isolated PostgreSQL
        run: bash server/tests/run-isolated.sh
