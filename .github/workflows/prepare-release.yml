name: Prepare Office guest release
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact qualified main SHA
        required: true
        type: string
      confirmation:
        description: Type PREPARE OFFICE GUEST
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor == 'thiepn' && github.triggering_actor == 'thiepn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact main and all push workflows
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICE_RELEASE_SHA: ${{ inputs.release_sha }}
          OFFICE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/authorize-release.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Prepare static guest-only artifact
        run: node scripts/prepare-release.mjs /tmp/office-static "$GITHUB_SHA"
      - name: Reverify exact main before artifact upload
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICE_RELEASE_SHA: ${{ inputs.release_sha }}
          OFFICE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/authorize-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: office-guest-release
          path: /tmp/office-static
          retention-days: 3
