name: Office quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm ci --no-audit --no-fund
      - run: node tests/verify-hub-adapter.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Verify generated publication documents with local XeLaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-plain-generic texlive-fonts-recommended lmodern poppler-utils
          node tests/compile-publication.mjs /tmp/office-publication
      - uses: actions/upload-artifact@v4
        with:
          name: office-publication-evidence
          path: /tmp/office-publication
